services:
  elasticsearch:
    build:
      context: ./docker/elasticsearch
    container_name: edocs-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - es-data:/usr/share/elasticsearch/data
    # 不映射宿主机端口：9200 仅在 compose 内部网络可达
    expose:
      - "9200"
    healthcheck:
      # 官方镜像不含 curl/wget，用 bash 的 /dev/tcp 探测端口
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  edocs:
    build:
      context: .
    container_name: edocs-app
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - EDOCS_ES=http://elasticsearch:9200
      - EDOCS_SCAN_ROOT=/data/scan
      - EDOCS_CACHE=/data/cache
    volumes:
      # 扫描根目录只读挂载；OCR JSON 缓存使用命名数据卷持久化
      - ${SCAN_ROOT:-./data/scan}:/data/scan:ro
      - cache-data:/data/cache
    ports:
      # 唯一对宿主机暴露的端口，供单位局域网访问
      - "8080:8080"
    restart: unless-stopped

volumes:
  es-data:
  cache-data:
