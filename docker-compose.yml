services:
  elasticsearch:
    image: zhangyiming748/edocs-es:latest
    container_name: edocs-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      # 单节点内网部署，放宽磁盘水位（默认 85%/90%/95%）。
      # 数据量极小（每年约300页），避免因宿主机磁盘偏紧导致集群 RED、索引只读。
      - cluster.routing.allocation.disk.watermark.low=90%
      - cluster.routing.allocation.disk.watermark.high=95%
      - cluster.routing.allocation.disk.watermark.flood_stage=97%
    volumes:
      - es-data:/usr/share/elasticsearch/data
    # 不映射宿主机端口：9200 仅在 compose 内部网络可达
    expose:
      - "9200"
    healthcheck:
      # 官方镜像不含 curl/wget，用 bash 的 /dev/tcp 探测端口
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  edocs:
    image: zhangyiming748/edocs:latest
    container_name: edocs-app
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - EDOCS_ES=http://elasticsearch:9200
      - EDOCS_SCAN_ROOT=/data/scan
      - EDOCS_CACHE=/data/cache
    volumes:
      # 扫描根目录只读挂载；OCR JSON 缓存绑定挂载到宿主机，便于直接查看与备份
      - ${SCAN_ROOT:-./data/scan}:/data/scan:ro
      - ./data/cache:/data/cache
    ports:
      # 唯一对宿主机暴露的端口，供单位局域网访问
      - "8080:8080"
    restart: unless-stopped

volumes:
  # 仅 ES 数据使用命名卷：私有数据、随机 I/O 密集、无需人工访问
  es-data:
