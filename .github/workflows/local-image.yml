# 手动把已发布到 Docker Hub 的镜像取回来（给无法直连 Docker Hub 的环境用）。
#
# 用法：仓库 Actions → 左侧选 "Fetch images (manual)" → Run workflow
#       填 tag（与发布时的 git tag 一致，如 v1.0.0；也可填 latest）、选架构。
# 跑完后在该次运行页面的 Artifacts 里下载 tar.gz，拷到目标机器。
# 导入只需一条命令（docker load 能直接读 gzip 包，不必先解压）：
#   docker load -i edocs-images-amd64-<tag>.tar.gz
#
# 为什么按架构分开导出：Docker Hub 上的多架构是 manifest list，docker pull 会按当前机器
# 架构自动选层；但 docker save 只能导出本地已有的那一份，所以一个 tar 里装不下两个架构。
# 同一个仓库 tag 在同一个任务里被 pull 两次的话，后一次会覆盖前一次，因此两个架构放在
# 两个并行任务里（矩阵），各自产出各自的 tar。
#
# save 为什么也要带 --platform：ubuntu-26.04 runner 预装的 Docker 默认启用 containerd
# 镜像存储，pull --platform 后本地只有单个架构的内容，但镜像 tag 仍指向多架构 manifest
# list；不带 --platform 的 save 会尝试导出整个 index，序列化时找不到另一平台的 digest，
# 报 "unable to create manifests file: content digest ...: not found"。旧 runner
# （ubuntu-latest）仍是传统存储，save 只导出本地拉到的那一份，所以早先不加也能跑通。
name: Fetch images (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要取回的镜像 tag（与发布时的 git tag 一致）
        required: true
        default: latest
      arch:
        description: 导出哪个架构
        required: true
        type: choice
        default: amd64
        options:
          - amd64
          - arm64
          - both

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      # 选 both 时展开成两个并行任务，否则只有所选的那一个。
      matrix:
        arch: ${{ inputs.arch == 'both' && fromJSON('["amd64", "arm64"]') || fromJSON(format('["{0}"]', inputs.arch)) }}
    steps:
      # 匿名拉取会受 Docker Hub 的 IP 限流影响，GitHub runner 是共享 IP，登录后更稳
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Pull images (linux/${{ matrix.arch }})
        run: |
          docker pull --platform linux/${{ matrix.arch }} zhangyiming748/edocs:${{ inputs.tag }}
          docker pull --platform linux/${{ matrix.arch }} zhangyiming748/edocs-es:${{ inputs.tag }}

      - name: Save to tar.gz
        run: |
          docker save --platform linux/${{ matrix.arch }} -o images-${{ matrix.arch }}.tar \
            zhangyiming748/edocs:${{ inputs.tag }} \
            zhangyiming748/edocs-es:${{ inputs.tag }}
          gzip -9 images-${{ matrix.arch }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: edocs-images-${{ matrix.arch }}-${{ inputs.tag }}
          path: images-${{ matrix.arch }}.tar.gz
          # tar 已用 gzip 压过，再压一遍纯属浪费
          compression-level: 0
          retention-days: 14

# ---- 取回后如何导入本机 ----
#
# 1. 在该次运行页面下载与自己机器架构匹配的工件：
#    x86_64 机器取 edocs-images-amd64-<tag>.tar.gz；Apple Silicon Mac / ARM 机器取 -arm64-。
# 2. 导入（docker load 不联网，可在离线机器上执行）。注意 docker load 能直接读 gzip 包，
#    不需要先解压、也不会解出散文件：
#      docker load -i edocs-images-amd64-<tag>.tar.gz
#    导入后镜像名与 Hub 上一致：zhangyiming748/edocs:<tag>、zhangyiming748/edocs-es:<tag>，
#    可执行 docker images | grep zhangyiming748 确认。
# 3. 之后在 deploy/ 目录执行 docker compose up -d 即可，无需再从 Hub 拉取。
#
# 几个坑：
#  - 一个 tar 只装一个架构。取错架构时 docker load 照样成功，但运行时（run / compose up）
#    会报 "exec format error"。
#  - 别双击那个 .tar.gz。macOS「归档实用工具」会把 docker save 的内容整个摊开成一堆散文件，
#    而这是不需要的——直接在终端里按上面第 2 步 load 即可。若已经摊开了也不影响，进那个
#    文件夹重新打回一个包再 load：
#      tar -cf ../images-repacked.tar .
#      docker load -i ../images-repacked.tar
#  - deploy/docker-compose.yml 里引用的是 :latest。若此处取回的 tag 不是 latest（如 v1.0.0），
#    需补改名，或把 compose 里两处 :latest 改成该 tag：
#      docker tag zhangyiming748/edocs:v1.0.0 zhangyiming748/edocs:latest
#      docker tag zhangyiming748/edocs-es:v1.0.0 zhangyiming748/edocs-es:latest
